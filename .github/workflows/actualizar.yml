name: Actualizar precios y publicar mapa

on:
  schedule:
    - cron: "45 06 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docs/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Actualizar precios
        if: github.event_name != 'push'
        run: python scripts/actualizar.py
      - name: Volumen y facturación (Res. 1104)
        if: github.event_name != 'push'
        continue-on-error: true
        run: python scripts/volumen.py
      - name: Guardar cambios
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --staged --quiet || git commit -m "Precios $(TZ=America/Argentina/Buenos_Aires date +'%Y-%m-%d %H:%M')"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
