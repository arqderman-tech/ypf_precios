name: Actualizar precios y publicar mapa

on:
  schedule:
    - cron: "11 10 * * *"   # 10:11 UTC = 07:11 hora Argentina (UTC-3, sin horario de verano)
  workflow_dispatch:         # botón "Run workflow" para probar a mano
  push:
    branches: [main]
    paths: ["docs/**"]       # republica si cambiás el diseño del mapa

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Actualizar precios
        if: github.event_name != 'push'
        run: python scripts/actualizar.py
      # El volumen (Res. 1104) NO corre acá: datos.energia.gob.ar no es alcanzable desde
      # los runners de GitHub. Lo corre el runner self-hosted en el Pi (volumen.yml).
      - name: Guardar cambios
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --staged --quiet || git commit -m "Precios $(TZ=America/Argentina/Buenos_Aires date +'%Y-%m-%d %H:%M')"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
