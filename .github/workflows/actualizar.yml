name: Actualizar precios y publicar mapa

on:
  schedule:
    - cron: "11 10 * * *"   # 10:11 UTC = 07:11 hora Argentina (UTC-3, sin horario de verano)
  workflow_dispatch:         # botón "Run workflow" para probar a mano
  push:
    branches: [main]
    paths: ["docs/**"]       # republica si cambiás el diseño del mapa

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Actualizar precios
        if: github.event_name != 'push'
        run: python scripts/actualizar.py
      # El volumen (Res. 1104) NO corre acá: datos.energia.gob.ar no es alcanzable desde
      # los runners de GitHub. Lo corre el runner self-hosted en el Pi (volumen.yml).
      - name: Guardar cambios
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --staged --quiet || git commit -m "Precios $(TZ=America/Argentina/Buenos_Aires date +'%Y-%m-%d %H:%M')"
          git push
      - uses: actions/configure-pages@v5
      - name: Limpiar artifacts github-pages previos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
          | python -c "
          import json,sys,urllib.request,os
          tok=os.environ['GH_TOKEN']
          arts=[a for a in json.load(sys.stdin)['artifacts'] if a['name']=='github-pages']
          for a in arts:
              req=urllib.request.Request(a['url'],method='DELETE',
                  headers={'Authorization':'Bearer '+tok,
                           'Accept':'application/vnd.github+json'})
              urllib.request.urlopen(req)
              print('borrado',a['id'])
          print(len(arts),'artifacts viejos eliminados')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
