name: Actualizar precios y publicar mapa

on:
  schedule:
    - cron: "45 06 * * *"   # 10:11 UTC = 07:11 hora Argentina (UTC-3, sin horario de verano)
  workflow_dispatch:         # botón "Run workflow" para probar a mano
  push:
    branches: [main]
    paths: ["docs/**"]       # republica si cambiás el diseño del mapa

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Actualizar precios
        if: github.event_name != 'push'
        run: python scripts/actualizar.py
      - name: Volumen y facturación (Res. 1104)
        if: github.event_name != 'push'
        continue-on-error: true
        # Corre todos los días: mira la fecha de modificación del recurso oficial y solo baja/cruza
        # el CSV (~134 MB) cuando cambió (≈1 vez por mes). Si todavía no salió el mes nuevo,
        # reintenta la corrida siguiente. El CSV se baja a una carpeta temporal y nunca se guarda.
        run: python scripts/volumen.py
      - name: Guardar cambios
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --staged --quiet || git commit -m "Precios $(TZ=America/Argentina/Buenos_Aires date +'%Y-%m-%d %H:%M')"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
